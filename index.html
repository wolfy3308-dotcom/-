<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - SP611E LED Controller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-6">

    <!-- الهيدر وحالة البلوتوث -->
    <header class="max-w-4xl w-full mx-auto flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-amber-400">لوحة التحكم بالإضاءة (SP611E)</h1>
            <p class="text-xs text-slate-400">معالج بروتوكول Sperll / BanlanX المباشر</p>
        </div>

        <div class="flex items-center gap-3">
            <span id="btStatusBadge" class="px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">
                غير متصل
            </span>
            <button id="btConnectBtn" onclick="connectSP611E()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-bold px-4 py-2 rounded-lg transition duration-200 shadow-md">
                اتصال بـ SP611E
            </button>
        </div>
    </header>

    <!-- منطقة عرض النتيجة والسجل -->
    <main class="max-w-4xl w-full mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex-grow flex flex-col justify-center items-center text-center my-2">
        <div class="flex justify-center gap-8 text-lg font-semibold mb-6 w-full">
            <div class="bg-slate-900/60 px-6 py-3 rounded-lg border border-slate-700/50 flex-1">
                الفريق الأول (A): <span id="scoreA" class="text-emerald-400 text-2xl font-bold mr-2">0</span>
            </div>
            <div class="bg-slate-900/60 px-6 py-3 rounded-lg border border-slate-700/50 flex-1">
                الفريق الثاني (B): <span id="scoreB" class="text-blue-400 text-2xl font-bold mr-2">0</span>
            </div>
        </div>

        <div class="w-full my-2 bg-slate-950 p-4 rounded-lg border border-slate-800 text-right">
            <div class="text-xs text-amber-400 mb-1 font-bold">سجل التشخيص والبيانات (Debug Console):</div>
            <p id="ledLog" class="text-xs text-emerald-400 font-mono leading-relaxed h-20 overflow-y-auto">اضغط على "اتصال بـ SP611E" لبدء الربط...</p>
        </div>
    </main>

    <!-- أزرار الأوامر -->
    <footer class="max-w-4xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <button onclick="judgeCorrect()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xl font-bold py-5 rounded-xl shadow-lg transition duration-200">
            إجابة صحيحة (أخضر)
        </button>
        <button onclick="judgeWrong()" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-xl font-bold py-5 rounded-xl shadow-lg transition duration-200">
            إجابة خاطئة (أحمر)
        </button>
    </footer>

    <script>
        // الخدمات التي تعتمدها شرائح SP611E و BanlanX
        const SERVICE_UUIDS = [0xffe0, 0xfff0, '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb'];
        const CHAR_UUIDS = [0xffe1, 0xfff1, '0000ffe1-0000-1000-8000-00805f9b34fb', '0000fff1-0000-1000-8000-00805f9b34fb'];

        let bluetoothDevice = null;
        let ledCharacteristic = null;

        function log(msg) {
            const logEl = document.getElementById('ledLog');
            logEl.innerHTML += `<br>> ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function connectSP611E() {
            const statusBadge = document.getElementById('btStatusBadge');
            document.getElementById('ledLog').innerHTML = "جارِ البحث عن الجهاز...";

            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: SERVICE_UUIDS
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                log("تم اختيار الجهاز: " + bluetoothDevice.name);

                const server = await bluetoothDevice.gatt.connect();
                log("تم الاتصال بـ GATT Server.");

                // مسح الخدمات المتاحة للوصول للخاصية الصحيحة
                let primaryService = null;
                for (let sUuid of SERVICE_UUIDS) {
                    try {
                        primaryService = await server.getPrimaryService(sUuid);
                        if (primaryService) {
                            log(`تم العثور على الخدمة: ${sUuid}`);
                            break;
                        }
                    } catch (e) {}
                }

                if (!primaryService) {
                    throw new Error("لم يتم العثور على خدمة FFE0 أو FFF0 مطابقة في القطعة.");
                }

                for (let cUuid of CHAR_UUIDS) {
                    try {
                        ledCharacteristic = await primaryService.getCharacteristic(cUuid);
                        if (ledCharacteristic) {
                            log(`تم العثور على قناة الكتابة: ${cUuid}`);
                            break;
                        }
                    } catch (e) {}
                }

                if (!ledCharacteristic) {
                    throw new Error("لم يتم العثور على قناة كتابة FFE1 أو FFF1.");
                }

                statusBadge.innerText = "متصل بـ SP611E";
                statusBadge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";

                // إرسال أمر تشغيل الطاقة فور الاتصال (Power ON)
                await sendPowerOn();

            } catch (error) {
                log("خطأ: " + error.message);
            }
        }

        function onDisconnected() {
            const statusBadge = document.getElementById('btStatusBadge');
            statusBadge.innerText = "غير متصل";
            statusBadge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
            log("انقطع الاتصال بالقطعة.");
            ledCharacteristic = null;
        }

        // أمر تشغيل الشريحة (Sperll Power ON)
        async function sendPowerOn() {
            if (!ledCharacteristic) return;
            log("إرسال أمر التشغيل (Power ON)...");
            
            // حزمة التشغيل الخاصة بـ Sperll SP611E
            const pwrPacket = new Uint8Array([0x38, 0x01, 0x00, 0x00, 0x00, 0x22, 0x83]);
            await writeToDevice(pwrPacket);
        }

        // دالة إرسال لون الإضاءة بصيغة Sperll/BanlanX المعتمدة
        async function setSP611EColor(r, g, b) {
            if (!ledCharacteristic) {
                log("تنبيه: اللمبة غير متصلة!");
                return;
            }

            log(`إرسال اللون (R:${r}, G:${g}, B:${b})...`);

            // بناء الحزمة الأساسية لشريحة SP611E (Sperll Protocol 0x38)
            // 0x38 = Header | R, G, B = Colors | 0x22 = Mode | 0x83 = Tail
            const packetFormat1 = new Uint8Array([0x38, r, g, b, 0x00, 0x22, 0x83]);
            
            // صيغة بديلة للـ BanlanX (0x53 Header)
            const packetFormat2 = new Uint8Array([0x53, 0x05, 0x01, r, g, b, 0x00, 0x53]);

            try {
                // إرسال البروتوكول الرئيسي
                await writeToDevice(packetFormat1);
                // إرسال البروتوكول المساند لضمان التوافق مع إصدار الفيرموير
                await writeToDevice(packetFormat2);
            } catch (error) {
                log("فشل إرسال اللون: " + error.message);
            }
        }

        async function writeToDevice(packet) {
            if (ledCharacteristic.properties.writeWithoutResponse) {
                await ledCharacteristic.writeValueWithoutResponse(packet);
            } else {
                await ledCharacteristic.writeValue(packet);
            }
        }

        // -------------------------------------------------------------
        // Supabase والتحكيم
        // -------------------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRoom = null;
        let judgeCurrentTeam = 'A';

        function judgeCorrect() {
            setSP611EColor(0, 255, 0); // أخضر

            if (!currentRoom) return;
            const pointsEarned = currentRoom.options_shown ? 1 : 2;
            const fields = { last_event: { type: 'correct', team: judgeCurrentTeam, nonce: Date.now() } };
            
            if (judgeCurrentTeam === 'A') {
                fields.score_a = (currentRoom.score_a || 0) + pointsEarned;
            } else {
                fields.score_b = (currentRoom.score_b || 0) + pointsEarned;
            }
            updateRoomFields(fields);
        }

        function judgeWrong() {
            setSP611EColor(255, 0, 0); // أحمر

            if (!currentRoom) return;
            updateRoomFields({ last_event: { type: 'wrong', team: judgeCurrentTeam, nonce: Date.now() } });
        }

        async function updateRoomFields(fields) {
            if (!currentRoom) return;
            await supabaseClient
                .from('rooms')
                .update(fields)
                .eq('id', currentRoom.id);
        }
    </script>
</body>
</html>
