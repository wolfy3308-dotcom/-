<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تشخيص أعطال السيارة - SP611E Bluetooth</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans select-none">

    <div class="w-full max-w-4xl bg-slate-900 rounded-3xl shadow-2xl p-6 border border-slate-800">
        
        <!-- Header & Bluetooth Connect Button -->
        <header class="flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-slate-800 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
                    <i class="fa-solid fa-car"></i> لوحة تشغيل إضاءة الأعطال
                </h1>
                <p class="text-slate-400 text-sm mt-1">المس العطل لإرسال الإشارة فوراً لشريط الليد عبر البلوتوث</p>
            </div>

            <!-- Bluetooth Connection Button -->
            <button id="connectBtn" onclick="connectBluetooth()" 
                    class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-2xl flex items-center gap-3 transition shadow-lg shadow-blue-500/20 active:scale-95">
                <i class="fa-solid fa-bluetooth-b text-xl"></i>
                <span id="connectBtnText">اقتران البلوتوث (SP611E)</span>
            </button>
        </header>

        <!-- Main Dashboard Content -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Fault Buttons Grid -->
            <div class="md:col-span-2 grid grid-cols-2 gap-4">
                
                <button onclick="triggerFault('المحرك', 'أحمر', '#ef4444', [0x38, 0xFF, 0x00, 0x00, 0x00, 0x83])" 
                        class="bg-slate-800 hover:bg-slate-700/80 p-6 rounded-2xl border border-slate-700 flex flex-col items-center gap-3 transition transform active:scale-95 group">
                    <i class="fa-solid fa-engine text-5xl text-red-500 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-lg text-slate-200">عطل المحرك</span>
                    <span class="text-xs bg-red-500/10 text-red-400 px-3 py-1 rounded-full border border-red-500/20">إضاءة حمراء</span>
                </button>

                <button onclick="triggerFault('الفرامل', 'أصفر', '#eab308', [0x38, 0xFF, 0xCC, 0x00, 0x00, 0x83])" 
                        class="bg-slate-800 hover:bg-slate-700/80 p-6 rounded-2xl border border-slate-700 flex flex-col items-center gap-3 transition transform active:scale-95 group">
                    <i class="fa-solid fa-triangle-exclamation text-5xl text-yellow-500 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-lg text-slate-200">نظام الفرامل</span>
                    <span class="text-xs bg-yellow-500/10 text-yellow-400 px-3 py-1 rounded-full border border-yellow-500/20">إضاءة صفراء</span>
                </button>

                <button onclick="triggerFault('الكهرباء والبطارية', 'أزرق', '#3b82f6', [0x38, 0x00, 0x66, 0xFF, 0x00, 0x83])" 
                        class="bg-slate-800 hover:bg-slate-700/80 p-6 rounded-2xl border border-slate-700 flex flex-col items-center gap-3 transition transform active:scale-95 group">
                    <i class="fa-solid fa-car-battery text-5xl text-blue-500 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-lg text-slate-200">نظام الكهرباء</span>
                    <span class="text-xs bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full border border-blue-500/20">إضاءة زرقاء</span>
                </button>

                <button onclick="triggerFault('حرارة المحرك', 'برتقالي', '#f97316', [0x38, 0xFF, 0x55, 0x00, 0x00, 0x83])" 
                        class="bg-slate-800 hover:bg-slate-700/80 p-6 rounded-2xl border border-slate-700 flex flex-col items-center gap-3 transition transform active:scale-95 group">
                    <i class="fa-solid fa-temperature-high text-5xl text-orange-500 group-hover:scale-110 transition"></i>
                    <span class="font-bold text-lg text-slate-200">ارتفاع الحرارة</span>
                    <span class="text-xs bg-orange-500/10 text-orange-400 px-3 py-1 rounded-full border border-orange-500/20">إضاءة برتقالية</span>
                </button>

                <button onclick="triggerFault('طبيعي', 'أخضر', '#22c55e', [0x38, 0x00, 0xFF, 0x00, 0x00, 0x83])" 
                        class="col-span-2 bg-slate-800 hover:bg-slate-700/80 p-4 rounded-2xl border border-emerald-500/40 flex items-center justify-center gap-3 transition transform active:scale-95">
                    <i class="fa-solid fa-circle-check text-2xl text-emerald-400"></i>
                    <span class="font-bold text-emerald-400 text-lg">إلغاء الأعطال (وضع التشغيل الطبيعي)</span>
                </button>

            </div>

            <!-- Visual Preview & Bluetooth Status -->
            <div class="bg-slate-950 rounded-2xl p-5 border border-slate-800 flex flex-col items-center justify-between shadow-inner">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">شاشة المعاينة الحية</span>
                
                <div class="my-6 text-center w-full">
                    <div id="lightRing" class="w-32 h-32 rounded-full border-4 border-slate-800 mx-auto mb-4 flex items-center justify-center transition-all duration-500">
                        <i id="previewIcon" class="fa-solid fa-lightbulb text-6xl text-slate-700 transition-all duration-500"></i>
                    </div>

                    <h3 id="activeFaultText" class="font-bold text-xl text-slate-300">جاهز للتجربة</h3>
                    <p id="activePatternText" class="text-xs text-slate-500 mt-1">الحالة: انتظار اختيار عطل</p>
                </div>

                <!-- Bluetooth Log Box -->
                <div class="w-full bg-slate-900 p-3 rounded-xl border border-slate-800 text-right">
                    <span class="text-[10px] text-slate-500 block mb-1">الأمر المرسل عبر البلوتوث (HEX):</span>
                    <code id="hexOutput" class="text-xs text-emerald-400 font-mono block truncate">--</code>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript - Web Bluetooth Integration -->
    <script>
        let bleDevice;
        let bleCharacteristic;

        // 1. الاتصال بقطعة SP611E عبر Web Bluetooth API
        async function connectBluetooth() {
            const connectBtn = document.getElementById('connectBtn');
            const connectBtnText = document.getElementById('connectBtnText');

            try {
                connectBtnText.innerText = "جاري البحث...";
                
                // طلب الاقتران مع أجهزة البلوتوث
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb'] // الخدمة التسلسلية الخاصة بـ SP611E
                });

                connectBtnText.innerText = "جاري الاتصال...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                // تحديث واجهة زر الاتصال
                connectBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                connectBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                connectBtnText.innerText = "متصل بـ SP611E";
                alert("تم الاقتران بالبلوتوث بنجاح! يمكنك الآن تجربة الأزرار.");

            } catch (error) {
                console.error("فشل الاتصال عبر البلوتوث:", error);
                connectBtnText.innerText = "اقتران البلوتوث (SP611E)";
                alert("لم يتم الاتصال. تأكد من:\n1. إغلاق تطبيق BanlanX تماماً من الجوال.\n2. تشغيل البلوتوث على جهازي الحساب/اللابتوب.");
            }
        }

        // 2. معالجة الضغط على أزرار الأعطال
        function triggerFault(faultName, colorName, hexColor, hexArray) {
            const ring = document.getElementById('lightRing');
            const icon = document.getElementById('previewIcon');
            const faultText = document.getElementById('activeFaultText');
            const patternText = document.getElementById('activePatternText');

            // تحديث واجهة الشاشة
            ring.style.borderColor = hexColor;
            ring.style.boxShadow = `0 0 35px ${hexColor}aa`;
            icon.style.color = hexColor;

            faultText.innerText = faultName === 'طبيعي' ? 'الحالة سليمة' : `عطل: ${faultName}`;
            patternText.innerText = `اللون: ${colorName}`;

            // إرسال الإشارة الفعليه للـ LED
            sendToLED(hexArray);
        }

        // 3. إرسال المصفوفة السداسية لـ SP611E
        async function sendToLED(hexArray) {
            const hexOutput = document.getElementById('hexOutput');
            const hexString = hexArray.map(b => '0x' + b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
            hexOutput.innerText = hexString;

            if (!bleCharacteristic) {
                console.warn("البلوتوث غير متصل حالياً! يرجى الضغط على زر اقتران البلوتوث أولاً.");
                return;
            }

            try {
                const commandBytes = new Uint8Array(hexArray);
                await bleCharacteristic.writeValueWithoutResponse(commandBytes);
                console.log("تم إرسال الإشارة للـ LED بنجاح:", hexString);
            } catch (e) {
                console.error("خطأ أثناء إرسال بيانات البلوتوث:", e);
            }
        }
    </script>
</body>
</html>
