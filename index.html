<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP611E — لوحة أعطال السيارة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b0f14;color:#eef3f8}
.wrap{max-width:1050px;margin:auto;padding:24px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:28px}.sub{color:#9eabb8;margin-top:6px}
.panel{background:#111820;border:1px solid #26313c;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 30px #0004}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:#263442}
button:hover{filter:brightness(1.12)}button.primary{background:#1778d2}button.danger{background:#9e2732}button.off{background:#343d46}
.status{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:#19232c;color:#aab6c1}
.dot{width:10px;height:10px;border-radius:50%;background:#d14}.dot.on{background:#27c56a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fault{min-height:125px;text-align:right;position:relative;overflow:hidden;border:1px solid #293640;background:#151d25}
.fault .icon{font-size:30px;display:block;margin-bottom:8px}.fault small{display:block;color:#9eabb8;margin-top:5px}
.fault.active{outline:2px solid #fff5;transform:translateY(-1px)}
.preview{height:80px;border-radius:14px;background:#05070a;border:1px solid #28323b;display:flex;align-items:center;justify-content:center;gap:8px}
.pixel{width:22px;height:22px;border-radius:50%;background:#15191e;box-shadow:0 0 12px #000}
.note{font-size:13px;line-height:1.7;color:#9eabb8}
.log{font-family:Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;background:#080b0f;border-radius:12px;padding:12px;min-height:70px;color:#a9c5d8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🚗 لوحة أعطال السيارة</h1>
    <div class="sub">تحكم مباشر في SP611E — كل عطل له لون خاص</div>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">غير متصل</span></div>
</header>

<section class="panel">
  <div class="controls">
    <button class="primary" id="connect">🔵 اتصال بالـ SP611E</button>
    <button class="primary" id="testRed">🔴 اختبار أحمر</button>
    <button class="off" id="off">⏻ إطفاء اللمبات</button>
  </div>
  <p class="note">استخدم Chrome أو Edge على جهاز يدعم Bluetooth. هذه النسخة تستخدم UUID القياسي لـSP611E. أغلق BanlanX قبل الاتصال لأن المتحكم يقبل اتصال Bluetooth واحدًا في نفس الوقت.</p>
</section>

<section class="panel">
  <h2>الأعطال</h2>
  <div class="grid">
    <button class="fault" data-name="حرارة المحرك" data-color="255,0,0"><span class="icon">🌡️</span>حرارة المحرك<small>أحمر</small></button>
    <button class="fault" data-name="ضغط الزيت" data-color="255,40,0"><span class="icon">🛢️</span>ضغط الزيت<small>أحمر برتقالي</small></button>
    <button class="fault" data-name="البطارية / الشحن" data-color="255,210,0"><span class="icon">🔋</span>البطارية / الشحن<small>أصفر</small></button>
    <button class="fault" data-name="فحص المحرك" data-color="255,105,0"><span class="icon">⚙️</span>Check Engine<small>برتقالي</small></button>
    <button class="fault" data-name="نظام الفرامل" data-color="255,0,80"><span class="icon">🛑</span>نظام الفرامل<small>أحمر وردي</small></button>
    <button class="fault" data-name="ضغط الإطارات" data-color="255,145,0"><span class="icon">🛞</span>ضغط الإطارات<small>برتقالي</small></button>
    <button class="fault" data-name="ABS" data-color="255,235,0"><span class="icon">⭕</span>ABS<small>أصفر فاتح</small></button>
    <button class="fault" data-name="نظام الوسائد الهوائية" data-color="255,0,35"><span class="icon">🧍</span>الوسائد الهوائية<small>أحمر</small></button>
    <button class="fault" data-name="مستوى الوقود منخفض" data-color="255,80,0"><span class="icon">⛽</span>وقود منخفض<small>برتقالي</small></button>
    <button class="fault" data-name="خدمة السيارة" data-color="120,0,255"><span class="icon">🔧</span>Service<small>بنفسجي</small></button>
    <button class="fault" data-name="خطأ إلكتروني" data-color="0,120,255"><span class="icon">⚡</span>خطأ إلكتروني<small>أزرق</small></button>
    <button class="fault" data-name="تحذير عام" data-color="255,255,255"><span class="icon">⚠️</span>تحذير عام<small>أبيض</small></button>
  </div>
</section>

<section class="panel">
  <h2>معاينة</h2>
  <div class="preview" id="preview">
    <span class="pixel"></span><span class="pixel"></span><span class="pixel"></span><span class="pixel"></span>
    <span class="pixel"></span><span class="pixel"></span><span class="pixel"></span><span class="pixel"></span>
  </div>
  <p id="selected" class="note">لم يتم اختيار عطل.</p>
</section>

<section class="panel">
  <h3>السجل</h3>
  <div class="log" id="log">جاهز.</div>
</section>
</div>

<script>
// BanlanX SP611E: vendor service E0FF, command characteristic FFE1
const SERVICE_UUID = "0000e0ff-0000-1000-8000-00805f9b34fb";
const CHAR_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
let device = null, characteristic = null;

const $ = id => document.getElementById(id);
function log(s){ $("log").textContent = new Date().toLocaleTimeString() + "  " + s; }
function setStatus(ok, text){ $("status").textContent=text; $("dot").className="dot"+(ok?" on":""); }

function packet(cmd, payload){
  return new Uint8Array([0x53, cmd, 0x00, 0x01, 0x00, payload.length, ...payload]);
}

async function send(cmd, payload){
  if(!characteristic || !device?.gatt?.connected) throw new Error("الاتصال غير موجود");

  // BanlanX SP6xxE frame:
  // 53 | command | 00 | 01 | 00 | payload length | payload...
  const data = new Uint8Array([0x53, cmd, 0x00, 0x01, 0x00, payload.length, ...payload]);
  log("TX: " + [...data].map(x=>x.toString(16).padStart(2,"0")).join(" "));

  // Prefer Write With Response when available; SP6xxE accepts this path.
  if(characteristic.properties.write && characteristic.writeValue){
    await characteristic.writeValue(data);
  }else if(characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse){
    await characteristic.writeValueWithoutResponse(data);
  }else{
    throw new Error("FFE1 لا يدعم الكتابة");
  }
}

async function setPower(on){
  await send(0x50,[on?1:0]);
}

async function setColor(r,g,b,brightness=255){
  // SP6xxE static RGB: command 0x52 + R,G,B,brightness
  await send(0x52,[r,g,b,brightness]);
}

async function connect(){
  if(!navigator.bluetooth){
    alert("المتصفح لا يدعم Web Bluetooth. استخدم Chrome أو Edge.");
    return;
  }

  try{
    setStatus(false,"جاري الاتصال...");
    device = await navigator.bluetooth.requestDevice({
      filters:[{name:"SP611E"}],
      optionalServices:[SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected",()=>{
      characteristic=null;
      setStatus(false,"انقطع الاتصال");
      log("BLE disconnected");
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    log("Service: " + service.uuid);
    log("Characteristic: " + characteristic.uuid);
    log("Write=" + characteristic.properties.write +
        " / WriteWithoutResponse=" + characteristic.properties.writeWithoutResponse);

    setStatus(true,"SP611E متصل");
    log("تم الاتصال. إرسال استعلام الحالة...");

    // SP6xxE state query.
    await send(0x02,[0x01]);
    log("جاهز — جرّب اختبار أحمر.");
  }catch(e){
    characteristic=null;
    setStatus(false,"غير متصل");
    log("CONNECT ERROR: " + e.name + " — " + e.message);
  }
}

$("connect").onclick=connect;

$("testRed").onclick=async()=>{
  try{
    await setPower(true);
    await new Promise(r=>setTimeout(r,120));
    await setColor(255,0,0,255);
    $("selected").textContent="اختبار: أحمر";
    document.querySelectorAll(".pixel").forEach(p=>{
      p.style.background="rgb(255,0,0)";
      p.style.boxShadow="0 0 18px rgb(255,0,0)";
    });
    log("TEST RED sent");
  }catch(e){
    log("TEST RED failed: "+e.message);
    alert("الاتصال موجود لكن إرسال الأمر فشل: "+e.message);
  }
};

$("off").onclick=async()=>{
  try{ await setPower(false); $("selected").textContent="تم إطفاء اللمبات."; log("OFF"); }
  catch(e){ log("OFF failed: "+e.message); }
};

document.querySelectorAll(".fault").forEach(btn=>{
  btn.onclick=async()=>{
    const [r,g,b]=btn.dataset.color.split(",").map(Number);
    document.querySelectorAll(".fault").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    $("selected").textContent=`العطل الحالي: ${btn.dataset.name} — RGB(${r}, ${g}, ${b})`;
    document.querySelectorAll(".pixel").forEach(p=>{
      p.style.background=`rgb(${r},${g},${b})`;
      p.style.boxShadow=`0 0 18px rgb(${r},${g},${b})`;
    });
    try{
      await setPower(true);
      await setColor(r,g,b,255);
      log(btn.dataset.name + " -> RGB " + [r,g,b].join(","));
    }catch(e){
      log("لم يتم الإرسال: "+e.message);
      alert("اضغط «اتصال بالـ SP611E» أولاً.");
    }
  };
});
</script>
</body>
</html>
